name: Release

# Al pushear un tag vX.Y.Z, arma la extensión y la publica como zip en Releases,
# para que se pueda instalar sin Node.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Empaquetar
        run: cd dist && zip -r "../linkedin-commenter-${GITHUB_REF_NAME}.zip" .
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "linkedin-commenter-${GITHUB_REF_NAME}.zip" --title "$GITHUB_REF_NAME" --generate-notes
