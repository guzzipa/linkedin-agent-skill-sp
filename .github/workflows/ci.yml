name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # El test compara el humanizador JS con el de Python del repo de skills.
      - uses: actions/checkout@v4
        with:
          repository: guzzipa/linkedin-agent-skill-sp
          path: vendor/linkedin-agent-skill-sp
        continue-on-error: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          SKILLS_REPO: vendor/linkedin-agent-skill-sp
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: linkedin-commenter-dist
          path: dist/
